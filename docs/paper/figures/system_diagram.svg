   </g>
   <g id="text_5">
    <text style="fill: #52514e; font: 6.2px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="255.6" y="45.867541" transform="rotate(-0 255.6 45.867541)">~28 fps, 47 ms packet age</text>
   </g>
   <g id="text_6">
    <text style="fill: #eb6834; font: 6.2px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="465.5808" y="45.867541" transform="rotate(-0 465.5808 45.867541)">4 RC channels at 40 Hz</text>
   </g>
   <g id="text_7">
    <text style="fill: #2a78d6; font: 6px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(152.928 157.222669)">telemetry back: attitude, raw gyro, status and RC in one MSP_MULTIPLE_MSP request,</text>
    <text style="fill: #2a78d6; font: 6px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(152.928 164.108232)">p95 20.3 ms with the stream running, on the same 115200-baud UART</text>
   </g>
   <g id="text_8">
    <text style="fill: #eb6834; font: 6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: end" x="653.04" y="187.911194" transform="rotate(-0 653.04 187.911194)">adapter on the command path: inverts the rate and throttle curves, pitch sign -1, gyro counts / 16.384</text>
   </g>
