   </g>
   <g id="text_10">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(45.517344 123.823606)">IMX477, 20 deg up-tilt</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(47.667617 130.878623)">1920x1080 at 30 fps</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(43.230172 137.93364)">HFOV 74 deg, fx 425 px</text>
   </g>
   <g id="text_11">
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="195.984" y="63.303993" transform="rotate(-0 195.984 63.303993)">gate detector</text>
   </g>
   <g id="text_12">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(160.588609 123.823606)">YOLOv8n-pose hand497</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(160.226312 130.878623)">640x360, 27 ms on GPU</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(161.912422 137.93364)">8 corners, kp conf 0.25</text>
   </g>
   <g id="text_13">
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="318.528" y="63.303993" transform="rotate(-0 318.528 63.303993)">observation</text>
   </g>
   <g id="text_14">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(279.893141 123.823606)">55 ch x 32 frames = 1760</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(278.788734 130.878623)">latched 30 Hz, delayed 1-4</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(278.761078 137.93364)">tracker picks the next gate</text>
   </g>
   <g id="text_15">
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="419.544" y="63.303993" transform="rotate(-0 419.544 63.303993)">policy</text>
   </g>
   <g id="text_16">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(402.163891 123.823606)">NumPy MLP</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(398.081828 130.878623)">3 x 256, 40 Hz</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(396.051859 137.93364)">thrust + 3 rates</text>
   </g>
   <g id="text_17">
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="520.56" y="63.303993" transform="rotate(-0 520.56 63.303993)">MSP override</text>
   </g>
   <g id="text_18">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(494.317906 123.823606)">mask 15 on AUX5</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(499.839938 130.878623)">no timeout on</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(499.775406 137.93364)">the last frame</text>
   </g>
   <g id="text_19">
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(593.932031 63.303993)">PID loop,</text>
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(598.163094 71.236849)">motors</text>
   </g>
   <g id="text_20">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(594.734508 123.823606)">440 deg/s at</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(600.968227 130.878623)">full stick</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(594.129297 137.93364)">DShot300 x4</text>
   </g>
   <g id="text_21">
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="96.624" y="275.054812" transform="rotate(-0 96.624 275.054812)">transmitter</text>
   </g>
   <g id="text_22">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(59.654047 329.43672)">AUX1 = ARM (radio only)</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(59.652664 336.491738)">AUX5 down = policy flies</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(74.183719 343.546755)">AUX2 = ANGLE</text>
   </g>
   <g id="text_23">
    <text style="fill: #0b0b0b; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="335.088" y="275.054812" transform="rotate(-0 335.088 275.054812)">props-off handover check</text>
   </g>
   <g id="text_24">
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(278.993289 329.43672)">streams neutral sticks first (the buffer</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(277.950187 336.491738)">starts at zero, which reads as failsafe),</text>
    <text style="fill: #0b0b0b; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(281.031555 343.546755)">then proves AUX5 off returns control</text>
   </g>
   <g id="text_25">
    <text style="fill: #e34948; font: 600 7.6px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="560.304" y="275.054812" transform="rotate(-0 560.304 275.054812)">the missing sensor</text>
   </g>
   <g id="text_26">
    <text style="fill: #e34948; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(497.841437 329.43672)">no usable height: the barometer collapses</text>
    <text style="fill: #e34948; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(509.317859 336.491738)">under prop wash, so height comes</text>
    <text style="fill: #e34948; font: 5.9px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(528.71457 343.546755)">from the gate in view</text>
   </g>
