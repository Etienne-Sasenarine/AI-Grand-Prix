   <g id="text_8">
    <text style="fill: #0b0b0b; font: 6.4px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle" x="252.558261" y="67.262" transform="rotate(-0 252.558261 67.262)">next gate one-hot x18</text>
   </g>
   <g id="text_9">
    <text style="fill: #0b0b0b; font: 6.4px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(311.175565 68.593) rotate(-90)">lap</text>
