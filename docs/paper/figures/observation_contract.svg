   <g id="text_10">
    <text style="fill: #0b0b0b; font: 6.4px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(326.136435 68.593) rotate(-90)">last actions x4 (v2)</text>
   </g>
   <g id="text_11">
    <text style="fill: #52514e; font: 6.3px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: start" x="22.16087" y="281.815794" transform="rotate(-0 22.16087 281.815794)">corner u,v: detector, through a 30 Hz latch, a 1-4 step delay and sticky dropout</text>
   </g>
   <g id="text_12">
    <text style="fill: #52514e; font: 6.3px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: start" x="22.16087" y="292.267058" transform="rotate(-0 22.16087 292.267058)">visible: -1 sentinel when unseen</text>
   </g>
   <g id="text_13">
    <text style="fill: #52514e; font: 6.3px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: start" x="22.16087" y="302.718321" transform="rotate(-0 22.16087 302.718321)">roll, pitch: flight controller attitude (nose-down positive on this FC)</text>
   </g>
   <g id="text_14">
    <text style="fill: #52514e; font: 6.3px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: start" x="22.16087" y="313.169584" transform="rotate(-0 22.16087 313.169584)">gyro: raw counts / 16.384, clipped +-8 rad/s</text>
   </g>
   <g id="text_15">
    <text style="fill: #52514e; font: 6.3px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: start" x="22.16087" y="323.620848" transform="rotate(-0 22.16087 323.620848)">velocity: dead-reckoned from issued thrust, attitude and a drag model; never the accelerometer</text>
   </g>
   <g id="text_16">
    <text style="fill: #52514e; font: 6.3px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: start" x="22.16087" y="334.072111" transform="rotate(-0 22.16087 334.072111)">next gate one-hot: from the gate tracker; nothing on the course publishes it</text>
   </g>
   <g id="text_17">
    <text style="fill: #52514e; font: 6.3px 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: start" x="22.16087" y="344.523375" transform="rotate(-0 22.16087 344.523375)">last actions: the issued command, not the delayed one</text>
   </g>
   <g id="text_18">
    <text style="fill: #0b0b0b; font: 6.4px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(10.192174 356.951953)">51 channels (v1, 1632 inputs) + 4 (v2, 1760). Every value both ends must agree on is hashed: v2 = a20c14d6a335.</text>
    <text style="fill: #0b0b0b; font: 6.4px 'Helvetica Neue', Helvetica, Arial, sans-serif" transform="translate(10.192174 364.118553)">A wrong channel order raises nothing; it flies.</text>
   </g>
